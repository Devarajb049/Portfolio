  <!-- Contact Section with Predefined Message -->
  <section id="contact" class="container p-5 mt-5 col-8" data-aos="fade-up">
    <h2 class="fw-bold mb-4 text-center">Contact Me</h2>
    <div class="row justify-content-center">
      <div class="col-10 col-lg-8">
        <form onsubmit="sendEmail(event)">
          <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" id="name" name="name" class="form-control" required autocomplete="off" />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" name="email" class="form-control" required autocomplete="off" />
          </div>

          <div class="mb-4">
            <label for="message" class="form-label">Message:</label>
            <textarea id="message" name="message" rows="5" class="form-control" required autocomplete="off"></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary">Send Email</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer class="text-center mt-5 py-4 bg-light shadow-sm">
    <p class="mb-0 text-muted">&copy; 2025 Bhojanapu Deva Raj. All rights reserved.</p>
  </footer>

  <script>
    function sendEmail(event) {
      event.preventDefault(); // Prevent actual form submission

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      const subject = `New message from ${name}`;
      const body = `Name: ${name}%0AEmail: ${email}%0A%0AMessage:%0A${message}`;
      const mailtoLink = `mailto:bhojanapudevaraj@gmail.com?subject=${encodeURIComponent(subject)}&body=${body}`;

      window.location.href = mailtoLink;
    }
  </script>
